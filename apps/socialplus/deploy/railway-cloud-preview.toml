# Select explicitly on a NEW isolated test service only. Never auto-deploy production.
[build]
builder = "DOCKERFILE"
dockerfilePath = "apps/socialplus/deploy/Dockerfile.cloud-preview"

[deploy]
healthcheckPath = "/healthz"
healthcheckTimeout = 180
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
numReplicas = 1
