<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#090d12">
<title>Viral+</title>
<link rel="stylesheet" href="styles.css">
<script src="https://js.puter.com/v2/"></script>
</head>
<body>
<div class="wrap">
<header class="brand"><div class="logo">V+</div><div><h1>Viral+</h1><small>Analyse réelle de vidéos courtes</small></div></header>
<section class="card">
<div class="top"><div><h2>Nouveau Reel</h2><p id="quota" class="muted">5 analyses / 24 h</p></div><span class="badge">IA réelle</span></div>
<label class="upload"><input id="videoInput" type="file" accept="video/*,video/mp4,video/quicktime,video/webm"><span><b>Choisir une vidéo</b><small>Photos ou Fichiers · MP4/MOV/WebM · 100 Mo max</small></span></label>
<div id="preview" class="hidden"><video id="video" controls playsinline></video><div class="meta"><div><small>Fichier</small><b id="fileName"></b></div><div><small>Taille / durée</small><b id="fileMeta"></b></div></div><button id="analyzeBtn">Analyser le Reel</button><p id="error" class="error"></p></div>
</section>
<section id="loading" class="card hidden"><h3>Analyse en cours</h3><p id="status">Lecture de la vidéo…</p><div class="progress"><i id="bar"></i></div><small class="muted">La vidéo est envoyée temporairement au moteur IA puis supprimée.</small></section>
<section id="result" class="hidden"></section>
<section class="card"><div class="top"><h3>Historique</h3><button id="clearHistory" class="ghost">Effacer</button></div><div id="history"></div></section>
</div>
<script src="analyzer.js"></script>
<script src="app.js"></script>
</body>
</html>
