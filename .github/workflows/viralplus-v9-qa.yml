name: Viral+ V9 QA and build

on:
  push:
    branches: [socialplus-viral-v9-quality-gates-20261016]
    paths:
      - 'apps/worker/**'
      - '.github/workflows/viralplus-v9-qa.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --omit=dev --no-audit --no-fund
      - run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg
      - run: node --check src/viral-verifier.js && node --check src/viral-personalization.js && node --check src/index.js
      - run: node --test tests/*.test.mjs
  image:
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ./apps/worker
          file: ./apps/worker/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/viral-edit-worker:viral-v9-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
