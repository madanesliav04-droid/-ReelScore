name: Remotion Browser Build
on:
  push:
    branches:
      - remotion-render-reel2-20260926
  workflow_dispatch:

jobs:
  build-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Remotion
        run: |
          rm -rf remotion-browser
          mkdir -p remotion-browser
          cd remotion-browser
          npm init -y
          npm install --save-exact remotion@4.0.506 @remotion/cli@4.0.506 @remotion/media@4.0.506 react@19.0.0 react-dom@19.0.0
      - name: Download official Remotion browser
        run: |
          cd remotion-browser
          ./node_modules/.bin/remotion browser ensure
          echo '--- Browser files ---'
          find "$HOME/.cache" -maxdepth 6 -type f 2>/dev/null | grep -E 'chrome|headless|remotion' || true
      - name: Pack Remotion browser cache
        run: |
          tar -czf remotion-browser-cache.tar.gz -C "$HOME" .cache/remotion || tar -czf remotion-browser-cache.tar.gz -C "$HOME" .cache
      - name: Upload browser artifact
        uses: actions/upload-artifact@v4
        with:
          name: remotion-browser-cache
          path: remotion-browser-cache.tar.gz
          compression-level: 0
          retention-days: 1
