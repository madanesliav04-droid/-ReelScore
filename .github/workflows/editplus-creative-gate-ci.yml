name: Edit+ Creative Gate Quality
on:
  push:
    branches: [editplus-creative-quality-gate-20261015]
  pull_request:
    branches: [editplus-editorial-rework-v9-20261012]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  creative-gate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Syntax checks
        run: |
          node --check src/index.js
          node --check src/broll.js
          node --check src/creative-quality-gate.js
      - name: Install FFmpeg for real media tests
        run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg fonts-noto-core
      - name: Full worker unit suite
        run: node --test tests/*.test.mjs
      - name: Explicit real-rush regression
        run: node --test tests/creative-real-rush-regression.test.mjs
