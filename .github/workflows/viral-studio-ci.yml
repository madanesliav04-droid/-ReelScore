name: Viral Studio CI
on:
  push:
    branches: [viral-studio-v1]
    paths:
      - "viral-studio/**"
      - ".github/workflows/viral-studio-ci.yml"
  pull_request:
    paths:
      - "viral-studio/**"
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: viral-studio
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run build
