name: Publish Social+ HyperFrames Worker (isolated)
on:
  push:
    branches: [socialplus-hyperframes-install-20261016]
    paths:
      - '.github/workflows/hyperframes-publish.yml'
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push isolated image (no production rollout)
        uses: docker/build-push-action@v6
        with:
          context: ./apps/worker
          file: ./apps/worker/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/viral-edit-worker:hyperframes-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
