name: Viral+ Edit+ CI

on:
  push:
    branches: [viral-edit-core, viralplus-vf]
  pull_request:

permissions:
  contents: read

jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: JavaScript syntax
        run: |
          node --check viralplus-ui.js
          if [ -f app.js ]; then node --check app.js; fi
      - name: No backend secrets in browser artifact
        run: |
          if grep -n -E 'SUPABASE_SERVICE_ROLE_KEY|STRIPE_SECRET_KEY|GEMINI_API_KEY[[:space:]]*=' \
            index.html config.js viralplus-product-config.js viralplus-ui.js; then
            echo "Backend secret reference found in browser artifact"
            exit 1
          fi
      - name: Required product files
        run: |
          test -f index.html
          test -f viralplus-ui.js
          test -f viralplus-product-config.js
          test -f supabase/migrations/20261006090000_shared_viral_edit_core.sql
          test -f docs/ARCHITECTURE.md

  alex-v7-word-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Worker syntax
        working-directory: apps/worker
        run: |
          node --check src/index.js
          node --check src/viral.js
          node --check src/alex-v7-audio-captions.js
          node --check src/alex-v7-runtime.js
      - name: ASR timings and no-premature-reveal regression tests
        working-directory: apps/worker
        run: |
          node --test test/alex-v7-audio-captions.test.js test/hyperframes-speech-sync.test.js test/hyperframes-story-first-gate.test.js

  alex-v7-hyperframes-visual-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PUPPETEER_SKIP_DOWNLOAD: '1'
      HYPERFRAMES_BROWSER_PATH: /usr/bin/chromium
      PUPPETEER_EXECUTABLE_PATH: /usr/bin/chromium
      CHROME_PATH: /usr/bin/chromium
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: System video tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq chromium ffmpeg fonts-liberation
      - name: Install pinned renderer
        working-directory: apps/worker
        run: npm install --no-audit --no-fund
      - name: Render synthetic word-level transcript test (NOT user audio)
        working-directory: apps/worker
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/apple-word-proof"
          node --input-type=module <<'EOF'
          import {writeFileSync} from 'node:fs';
          import {alexV7CaptionHtml} from './src/alex-v7-audio-captions.js';
          const demo={
           outputDurationMs:4500,groups:[
            {startMs:400,endMs:2300,words:[
             {text:'Une',startMs:400,endMs:720},
             {text:'idée',startMs:850,endMs:1200},
             {text:'devient',startMs:1420,endMs:1730},
             {text:'visible',startMs:1870,endMs:2150}]},
            {startMs:2650,endMs:4160,words:[
             {text:'au',startMs:2650,endMs:2890},
             {text:'bon',startMs:3070,endMs:3300},
             {text:'moment.',startMs:3530,endMs:4020}]}
           ]
          };
          writeFileSync(process.env.RUNNER_TEMP+'/apple-word-proof/index.html',
            alexV7CaptionHtml(demo,{width:960,height:540}));
          EOF
          cd "$RUNNER_TEMP/apple-word-proof"
          "$GITHUB_WORKSPACE/apps/worker/node_modules/.bin/hyperframes" lint .
          "$GITHUB_WORKSPACE/apps/worker/node_modules/.bin/hyperframes" render --format webm --quality draft --workers 2 --fps 30 --output "$RUNNER_TEMP/alex-v7-synthetic-wordtimed.webm"
          test -s "$RUNNER_TEMP/alex-v7-synthetic-wordtimed.webm"
          ffmpeg -hide_banner -loglevel error -xerror -i "$RUNNER_TEMP/alex-v7-synthetic-wordtimed.webm" -f null -
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: alex-v7-synthetic-word-timing-proof
          path: ${{ runner.temp }}/alex-v7-synthetic-wordtimed.webm
          retention-days: 5
