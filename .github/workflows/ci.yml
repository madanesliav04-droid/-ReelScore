name: Viral+ Edit+ CI

on:
  push:
    branches: [viral-edit-core, viralplus-vf]
  pull_request:

permissions:
  contents: read

jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: JavaScript syntax
        run: |
          node --check viralplus-ui.js
          if [ -f app.js ]; then node --check app.js; fi
      - name: No backend secrets in browser artifact
        run: |
          if grep -n -E 'SUPABASE_SERVICE_ROLE_KEY|STRIPE_SECRET_KEY|GEMINI_API_KEY[[:space:]]*=' \
            index.html config.js viralplus-product-config.js viralplus-ui.js; then
            echo "Backend secret reference found in browser artifact"
            exit 1
          fi
      - name: Required product files
        run: |
          test -f index.html
          test -f viralplus-ui.js
          test -f viralplus-product-config.js
          test -f supabase/migrations/20261006090000_shared_viral_edit_core.sql
          test -f docs/ARCHITECTURE.md

  alex-v7-word-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Worker syntax
        working-directory: apps/worker
        run: |
          node --check src/index.js
          node --check src/viral.js
          node --check src/alex-v7-audio-captions.js
          node --check src/alex-v7-runtime.js
          node --check src/alex-v8-release.js
          node --check src/social-kinetic-reference-v4.js
          node --check src/social-kinetic-v4-runtime.js
          node --check src/social-kinetic-v10-release.js
          node --check src/social-kinetic-v15-ios-audio.js
          node --check src/social-kinetic-v10-score.js
          node --check src/social-kinetic-v10-word-plan.js
          node --check src/social-kinetic-v10-runtime.js
          node --check src/hyperframes-renderer.js
      - name: ASR timings and no-premature-reveal regression tests
        working-directory: apps/worker
        run: |
          node --test test/alex-v7-audio-captions.test.js test/hyperframes-speech-sync.test.js test/hyperframes-story-first-gate.test.js test/alex-v8-release.test.js test/social-kinetic-reference-v4.test.js test/social-kinetic-v10-release.test.js test/social-kinetic-v10-score.test.js test/social-kinetic-v15-ios-audio.test.js test/social-kinetic-v10-word-plan.test.js

  alex-v7-hyperframes-visual-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PUPPETEER_SKIP_DOWNLOAD: '1'
      HYPERFRAMES_BROWSER_PATH: /usr/bin/chromium
      PUPPETEER_EXECUTABLE_PATH: /usr/bin/chromium
      CHROME_PATH: /usr/bin/chromium
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: System video tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq chromium ffmpeg fonts-liberation
      - name: Install pinned renderer
        working-directory: apps/worker
        run: npm install --no-audit --no-fund
      - name: Render synthetic word-level transcript test (NOT user audio)
        working-directory: apps/worker
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/apple-word-proof"
          node --input-type=module <<'EOF'
          import {writeFileSync} from 'node:fs';
          import {alexV7CaptionHtml} from './src/alex-v7-audio-captions.js';
          const demo={
           outputDurationMs:4500,groups:[
            {startMs:400,endMs:2300,words:[
             {text:'Une',startMs:400,endMs:720},
             {text:'idée',startMs:850,endMs:1200},
             {text:'devient',startMs:1420,endMs:1730},
             {text:'visible',startMs:1870,endMs:2150}]},
            {startMs:2650,endMs:4160,words:[
             {text:'au',startMs:2650,endMs:2890},
             {text:'bon',startMs:3070,endMs:3300},
             {text:'moment.',startMs:3530,endMs:4020}]}
           ]
          };
          writeFileSync(process.env.RUNNER_TEMP+'/apple-word-proof/index.html',
            alexV7CaptionHtml(demo,{width:960,height:540}));
          EOF
          cd "$RUNNER_TEMP/apple-word-proof"
          "$GITHUB_WORKSPACE/apps/worker/node_modules/.bin/hyperframes" lint .
          "$GITHUB_WORKSPACE/apps/worker/node_modules/.bin/hyperframes" render --format webm --quality draft --workers 2 --fps 30 --output "$RUNNER_TEMP/alex-v7-synthetic-wordtimed.webm"
          test -s "$RUNNER_TEMP/alex-v7-synthetic-wordtimed.webm"
          ffmpeg -hide_banner -loglevel error -xerror -i "$RUNNER_TEMP/alex-v7-synthetic-wordtimed.webm" -f null -
      - name: V8 alpha overlay and original audio composition proof
        run: |
          set -euo pipefail
          # Synthetic source: no customer media, no external audio inference.
          ffmpeg -hide_banner -loglevel error -y \
            -f lavfi -i color=c=0x174832:s=960x540:r=30:d=4.5 \
            -f lavfi -i sine=frequency=440:duration=4.5:sample_rate=48000 \
            -map 0:v -map 1:a -c:v libx264 -pix_fmt yuv420p \
            -c:a aac -t 4.5 "$RUNNER_TEMP/v8-source.mp4"
          ffprobe -v error -show_entries stream_tags=alpha_mode:stream=codec_name \
            -of json "$RUNNER_TEMP/alex-v7-synthetic-wordtimed.webm"
          # libvpx-vp9 is required to decode the WebM alpha plane.
          ffmpeg -hide_banner -loglevel error -y \
            -i "$RUNNER_TEMP/v8-source.mp4" \
            -c:v libvpx-vp9 -i "$RUNNER_TEMP/alex-v7-synthetic-wordtimed.webm" \
            -filter_complex "[0:v][1:v]overlay=x=0:y=0:format=auto:shortest=1,format=yuv420p[v]" \
            -map "[v]" -map "0:a:0" -c:v libx264 -pix_fmt yuv420p \
            -c:a copy "$RUNNER_TEMP/v8-composite.mp4"
          ffmpeg -hide_banner -loglevel error -xerror -i "$RUNNER_TEMP/v8-composite.mp4" -f null -
          python3 - "$RUNNER_TEMP/v8-composite.mp4" <<'EOF'
          import json,subprocess,sys
          p=json.loads(subprocess.check_output(['ffprobe','-v','error','-show_streams','-show_format','-of','json',sys.argv[1]]))
          v=[x for x in p['streams'] if x['codec_type']=='video']
          a=[x for x in p['streams'] if x['codec_type']=='audio']
          assert len(v)==1 and len(a)==1, 'voice missing or doubled'
          assert (v[0]['width'],v[0]['height'])==(960,540),'wrong native raster'
          assert 4.3<float(p['format']['duration'])<4.7,'overlay changes duration'
          print('V8 synthetic composition: valid video + single original audio track')
          EOF
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: alex-v7-synthetic-word-timing-proof
          path: ${{ runner.temp }}/alex-v7-synthetic-wordtimed.webm
          retention-days: 5

  social-kinetic-v4-reference-visual-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PUPPETEER_SKIP_DOWNLOAD: '1'
      HYPERFRAMES_BROWSER_PATH: /usr/bin/chromium
      PUPPETEER_EXECUTABLE_PATH: /usr/bin/chromium
      CHROME_PATH: /usr/bin/chromium
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Renderer dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq chromium ffmpeg fonts-liberation
      - name: Install pinned renderer
        working-directory: apps/worker
        run: npm install --no-audit --no-fund
      - name: Render five-second visual contract demo (FICTIONAL WORDS, NO USER AUDIO)
        working-directory: apps/worker
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/social-kinetic-v4-proof"
          node --input-type=module <<'EOF'
          import {writeFileSync} from 'node:fs';
          import {socialKineticReferenceV4Html} from './src/social-kinetic-reference-v4.js';
          const safety={x:.57,y:.28,w:.35,h:.44};
          const p={outputDurationMs:5000,events:[
           {id:'n',kind:'hero',text:'3 FAÇONS',startMs:200,endMs:1400,
             safeRect:safety,words:[]},
           {id:'f',kind:'phrase',text:'UN PROBLÈME RÉEL',startMs:1500,endMs:2900,
             safeRect:safety,words:[
              {text:'Un',startMs:1500},{text:'problème',startMs:1870},{text:'réel',startMs:2320}]},
           {id:'q',kind:'chat',text:'Un exemple explicitement illustré',
            exampleOnly:true,startMs:3000,endMs:4800,safeRect:safety,words:[]}
          ]};
          writeFileSync(process.env.RUNNER_TEMP+'/social-kinetic-v4-proof/index.html',
            socialKineticReferenceV4Html(p,{width:960,height:540}));
          EOF
          cd "$RUNNER_TEMP/social-kinetic-v4-proof"
          "$GITHUB_WORKSPACE/apps/worker/node_modules/.bin/hyperframes" lint .
          "$GITHUB_WORKSPACE/apps/worker/node_modules/.bin/hyperframes" render \
            --format webm --quality draft --workers 2 --fps 30 \
            --output "$RUNNER_TEMP/social-kinetic-v4-synthetic.webm"
          ffmpeg -hide_banner -loglevel error -xerror \
            -i "$RUNNER_TEMP/social-kinetic-v4-synthetic.webm" -f null -
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: social-kinetic-v4-synthetic-visual-contract-not-user-rush
          path: ${{ runner.temp }}/social-kinetic-v4-synthetic.webm
          retention-days: 5

