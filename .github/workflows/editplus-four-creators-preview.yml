          ffprobe -v error -show_entries stream=width,height,codec_name,pix_fmt:format=duration -of json "$RUNNER_TEMP/ALEX_V7_APPLE_44s.webm"
          ffmpeg -hide_banner -loglevel error -xerror -c:v libvpx-vp9 -i "$RUNNER_TEMP/ALEX_V7_APPLE_44s.webm" -f null -
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: editplus-alex-v7-apple-kinetic-full-overlay
          path: ${{ runner.temp }}/ALEX_V7_APPLE_44s.webm
          retention-days: 7
