name: Edit+ Alex REF3 Navy full 44.5s HyperFrames render
on:
  push:
    branches: [editplus-alex-reference-lock-20261017]
    paths:
      - 'apps/worker/hyperframes/four-creators/full/ALEX_REF3_NAVY_V2/**'
      - '.github/workflows/alex-ref3-full-render.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  alex-ref3-render:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      PUPPETEER_SKIP_DOWNLOAD: '1'
      HYPERFRAMES_BROWSER_PATH: /usr/bin/chromium
      PUPPETEER_EXECUTABLE_PATH: /usr/bin/chromium
      CHROME_PATH: /usr/bin/chromium
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium, video tools and fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq chromium ffmpeg fonts-liberation fonts-dejavu-core
      - name: Install locked HyperFrames
        working-directory: apps/worker
        run: |
          npm install --no-audit --no-fund
          node -e 'const p=require("./node_modules/hyperframes/package.json");if(p.version!=="0.8.164")process.exit(2)'
      - name: Lint and render model full timeline
        working-directory: apps/worker/hyperframes/four-creators/full/ALEX_REF3_NAVY_V2
        run: |
          set -euo pipefail
          "$GITHUB_WORKSPACE/apps/worker/node_modules/.bin/hyperframes" lint .
          "$GITHUB_WORKSPACE/apps/worker/node_modules/.bin/hyperframes" render --format webm --quality looks --workers 3 --fps 30 --output "$RUNNER_TEMP/EDITPLUS_ALEX_REF3_NAVY_V2_44s.webm"
          test -s "$RUNNER_TEMP/EDITPLUS_ALEX_REF3_NAVY_V2_44s.webm"
          ffprobe -v error -show_entries format=duration:stream=codec_name,width,height,pix_fmt:stream_tags=alpha_mode -of json "$RUNNER_TEMP/EDITPLUS_ALEX_REF3_NAVY_V2_44s.webm"
          ffmpeg -hide_banner -loglevel error -xerror -i "$RUNNER_TEMP/EDITPLUS_ALEX_REF3_NAVY_V2_44s.webm" -f null -
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: editplus-alex-ref3-navy-v2-full44s
          path: ${{ runner.temp }}/EDITPLUS_ALEX_REF3_NAVY_V2_44s.webm
          retention-days: 7
