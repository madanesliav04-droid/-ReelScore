name: Reference Apple message-system sound review
on:
  push:
    branches:
      - editplus-social-kinetic-v15-ios-bloup-audio-20261018
    paths:
      - .github/workflows/ios-message-sound-reference.yml
  workflow_dispatch:
jobs:
  audio-reference-for-private-listening:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Install FFmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -qq -y ffmpeg
      - name: Fetch two iOS message system sound references
        run: |
          set -euo pipefail
          mkdir -p message-sound-reference
          for kind in SentMessage ReceivedMessage; do
            curl -fL --retry 3 --connect-timeout 20 \
              "https://raw.githubusercontent.com/extratone/iOSSystemSounds/main/m4a/$kind.m4a" \
              -o "message-sound-reference/$kind-system-original.m4a"
            ffprobe -v error -show_entries stream=codec_name,channels,sample_rate \
              -show_entries format=duration -of default=noprint_wrappers=1 \
              "message-sound-reference/$kind-system-original.m4a"
            ffmpeg -nostdin -y -hide_banner -loglevel error \
              -i "message-sound-reference/$kind-system-original.m4a" \
              -ar 48000 -ac 2 -c:a pcm_s16le \
              "message-sound-reference/$kind-original-reference.wav"
          done
          cat > message-sound-reference/NOTICE.txt <<'EOF'
          These Apple system audio reference files come from an unofficial public archive.
          Private listening reference only: commercial rights NOT verified.
          Do not ship these assets in a commercial product without authorization.
          EOF
      - uses: actions/upload-artifact@v4
        with:
          name: ios-sent-vs-received-authentic-listening-reference
          path: message-sound-reference/
          retention-days: 1
