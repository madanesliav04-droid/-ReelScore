name: Deploy Viral+ Pages

on:
  push:
    branches: [viralplus-vf]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: viralplus-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout isolated Viral+ branch
        uses: actions/checkout@v4
        with:
          ref: viralplus-vf
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Build isolated static artifact
        run: |
          rm -rf site
          mkdir site
          cp index.html viralplus-ui.css config.js viralplus-product-config.js viralplus-ui.js site/
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
