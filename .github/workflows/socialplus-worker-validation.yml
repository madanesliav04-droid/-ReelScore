name: Social+ isolated server and native 1080p UI preflight
on:
  workflow_dispatch:
    inputs:
      mode:
        description: Full preflight or read-only summary of the completed proof
        type: choice
        options: [preflight, summary]
        default: preflight
permissions:
  contents: read
concurrency:
  group: socialplus-isolated-server-preflight
  cancel-in-progress: false
jobs:
  preflight:
    if: github.repository == 'madanesliav04-droid/-ReelScore' && github.event.repository.private == false && github.ref == 'refs/heads/codex/socialplus-server-preflight-20261104' && inputs.mode != 'summary'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      HF_HUB_OFFLINE: '1'
      HF_HUB_DISABLE_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Prepare private ephemeral test paths
        run: |
          umask 077
          work="$RUNNER_TEMP/socialplus-server-preflight"
          mkdir -p "$work"
          echo "SOCIALPLUS_ACTIONS_WORK_DIR=$work" >> "$GITHUB_ENV"
          echo "SOCIALPLUS_PYTHON=$work/fixture-venv/bin/python" >> "$GITHUB_ENV"
      - name: Generate licensed non-personal native 1080p fixture
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg python3-venv openssl
          python3 -m venv "$SOCIALPLUS_ACTIONS_WORK_DIR/fixture-venv"
          "$SOCIALPLUS_PYTHON" -m pip install --no-cache-dir piper-tts==1.3.0
          python3 apps/socialplus/scripts/ci/synthetic-fixture.py
      - name: Build exact standalone deployment image with offline model
        run: docker build -f apps/socialplus/deploy/Dockerfile.cloud-preview -t socialplus-preflight:20261104 .
      - name: Real MFA login upload Alex render preview download and restart inside image
        id: ui
        run: python3 apps/socialplus/scripts/ci/container-ui-preflight.py
      - name: Encrypt result and measurements before log-only delivery
        if: always() && steps.ui.outcome != 'skipped'
        run: python3 apps/socialplus/scripts/ci/seal-ui-result.py
      - name: Clean ephemeral generated files
        if: always()
        run: rm -rf -- "$RUNNER_TEMP/socialplus-server-preflight"
# Standard free public runner only. No services, artifacts, cache, keys or deployment.

  summary:
    if: github.repository == 'madanesliav04-droid/-ReelScore' && github.event.repository.private == false && github.ref == 'refs/heads/codex/socialplus-server-preflight-20261104' && inputs.mode == 'summary'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
    steps:
      - name: Read only the numeric proof from the completed job, without a new render
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PYCODE'
          import os,json,urllib.request,urllib.error
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self,*args):return None
          url='https://api.github.com/repos/madanesliav04-droid/-ReelScore/actions/jobs/126759628433/logs'
          req=urllib.request.Request(url,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
          try:
              response=urllib.request.build_opener(NoRedirect).open(req,timeout=30)
              text=response.read().decode('utf-8-sig')
          except urllib.error.HTTPError as error:
              if error.code!=302:raise RuntimeError('SOURCE_LOG_READ_FAILED') from None
              # Standard GitHub log-download redirect, no authorization forwarded.
              with urllib.request.urlopen(error.headers['Location'],timeout=90) as response:
                  text=response.read().decode('utf-8-sig')
          found={}
          for line in text.splitlines():
              for name,marker in [('ui','{"media":'),('resources','{"case": "ui-1080p"')]:
                  i=line.find(marker)
                  if i>=0:found[name]=json.loads(line[i:])
          if set(found)!={'ui','resources'}:raise RuntimeError('PROOF_SUMMARY_MISSING')
          print('SOURCE_JOB: 126759628433; no rendering executed in this recovery job')
          print('VERIFIED_PROOF_JSON '+json.dumps(found))
          PYCODE
