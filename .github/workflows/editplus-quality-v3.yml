name: Edit+ proof-first quality V3
on:
  push:
    branches: [editplus-quality-director-v3-20261012]
  workflow_dispatch:
jobs:
  syntax-and-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: apps/worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check worker integration syntax
        run: |
          node --check src/index.js
          node --check src/edit.js
          node --check src/viral.js
          node --check src/render.js
          node --check src/premium-quality-v3.js
      - name: Run full worker test suite
        run: node --test tests/*.test.mjs
