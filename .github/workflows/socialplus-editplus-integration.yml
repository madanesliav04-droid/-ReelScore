name: Social+ Edit+ integration verification and preview image

on:
  push:
    branches: [socialplus-editplus-integrated-20261016]
    paths:
      - 'apps/worker/**'
      - '.github/workflows/socialplus-editplus-integration.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --omit=dev --no-audit --no-fund
      - name: Install FFmpeg tooling
        run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg
      - run: node --check src/index.js && node --check src/edit.js && node --check src/render.js && node --check src/social-kinetic-v1.js
      - run: node --test tests/*.test.mjs
  image:
    runs-on: ubuntu-latest
    needs: tests
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ./apps/worker
          file: ./apps/worker/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/viral-edit-worker:socialplus-integration-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
