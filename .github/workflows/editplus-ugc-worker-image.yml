name: Build Edit+ UGC test worker

on:
  push:
    branches: [editplus-ugc-worker-v1-20261018]
    paths:
      - 'apps/worker/**'
      - '.github/workflows/editplus-ugc-worker-image.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  ugc-worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Install FFmpeg for real render QA
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
      - name: Test multi-rush composer
        run: |
          node --check apps/worker/src/index.js
          node --check apps/worker/src/ugc-rush-compositor.js
          node --check apps/worker/src/ugc-visual-sequence.js
          ffmpeg -version | head -n 1
          node --test apps/worker/tests/ugc-multirush.test.mjs apps/worker/tests/ugc-visual-sequence.test.mjs
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository_owner }}/viral-edit-worker
          tags: |
            type=sha,prefix=ugc-
      - uses: docker/build-push-action@v6
        with:
          context: ./apps/worker
          file: ./apps/worker/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
